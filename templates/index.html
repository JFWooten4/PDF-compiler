<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Compiler</title>
  <script>
    (() => {
      const saved = localStorage.getItem('pdf-compiler-theme');
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
    })();
  </script>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-subtle: #f9fafc;
      --text: #172033;
      --muted: #596273;
      --subtle: #687285;
      --border: #d8deea;
      --control-border: #cbd3df;
      --button-bg: #172033;
      --button-text: #ffffff;
      --shadow: rgba(28, 39, 61, .05);
      --focus: #6579a8;
      --success: #17663a;
      --success-bg: #edf8f1;
      --error: #a52a2a;
      --error-bg: #fff1f1;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #161b22;
      --surface-subtle: #11161d;
      --text: #e6edf3;
      --muted: #aab4c0;
      --subtle: #8d98a6;
      --border: #30363d;
      --control-border: #3d444d;
      --button-bg: #e6edf3;
      --button-text: #0d1117;
      --shadow: rgba(0, 0, 0, .28);
      --focus: #8aa4dc;
      --success: #7ee2a8;
      --success-bg: #10261a;
      --error: #ff9b9b;
      --error-bg: #301515;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 56px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    h1 { margin: 0 0 6px; font-size: 30px; }
    .intro { margin: 0; color: var(--muted); }
    form { display: grid; gap: 18px; }
    fieldset { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 20px; box-shadow: 0 8px 22px var(--shadow); }
    legend { font-weight: 700; padding: 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
    .full { grid-column: 1 / -1; }
    label { display: grid; gap: 6px; font-size: 14px; font-weight: 650; }
    input, select, textarea { width: 100%; border: 1px solid var(--control-border); border-radius: 9px; padding: 10px 11px; background: var(--surface-subtle); color: var(--text); font: inherit; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: transparent; }
    textarea { min-height: 110px; resize: vertical; }
    #markdown { min-height: 230px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    small { color: var(--subtle); font-weight: 400; }
    .check { display: flex; align-items: center; gap: 9px; font-weight: 600; }
    .check input { width: auto; }
    .preview { display: none; max-width: 230px; max-height: 90px; object-fit: contain; border: 1px dashed var(--control-border); border-radius: 8px; padding: 7px; background: var(--surface-subtle); }
    .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    button { border: 1px solid transparent; border-radius: 10px; padding: 12px 18px; background: var(--button-bg); color: var(--button-text); font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { opacity: .9; }
    .secondary { border-color: var(--border); background: var(--surface); color: var(--text); }
    .theme-toggle { flex: 0 0 auto; padding: 9px 12px; border-color: var(--border); background: var(--surface); color: var(--text); box-shadow: 0 4px 12px var(--shadow); }
    .validation { display: none; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface); }
    .validation.pass { display: block; color: var(--success); background: var(--success-bg); }
    .validation.fail { display: block; color: var(--error); background: var(--error-bg); }
    .validation strong { display: block; margin-bottom: 6px; }
    .validation ul { margin: 8px 0 0 20px; padding: 0; }
    .validation li { margin: 6px 0; }
    .validation code { color: inherit; }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .topbar { align-items: center; }
    }
  </style>
</head>
<body>
<main>
  <div class="topbar">
    <div>
      <h1>PDF Compiler</h1>
      <p class="intro">Configure the letterhead and document presentation, validate legal style, then render the PDF.</p>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme"></button>
  </div>

  <form id="compiler-form" action="/render" method="post" enctype="multipart/form-data" target="_blank">
    <fieldset>
      <legend>Document</legend>
      <div class="grid">
        <label>Markdown file
          <input type="file" name="source" accept=".md,.markdown,text/markdown,text/plain">
          <small>If supplied, this takes precedence over pasted Markdown.</small>
        </label>
        <label>Output filename
          <input name="output_name" value="document.pdf">
        </label>
        <label class="full">Or paste Markdown
          <textarea id="markdown" name="markdown" placeholder="# Letter&#10;&#10;Your document…"></textarea>
        </label>
        <label>PDF title
          <input name="title" placeholder="Comment Letter">
        </label>
        <label>PDF author
          <input name="author" placeholder="Organization or author">
        </label>
        <label>Start after heading
          <input name="start_heading" placeholder="Letter">
          <small>Optional exact Markdown heading.</small>
        </label>
        <label class="check full"><input type="checkbox" name="smart_quotes"> Use smart quotes in rendered PDF</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Branding</legend>
      <div class="grid">
        <label>Logo image
          <input id="logo" type="file" name="logo" accept="image/*">
        </label>
        <label>Logo treatment
          <select name="logo_treatment">
            {% for value, label in image_treatments.items() %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <label>Text wordmark
          <input name="wordmark" placeholder="Used when no logo is uploaded">
        </label>
        <div>
          <img id="logo-preview" class="preview" alt="Logo preview">
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Letterhead</legend>
      <div class="grid">
        <label class="check full"><input type="checkbox" name="show_date" checked> Show date in header</label>
        <label>Date
          <input type="date" name="date_value" value="{{ today }}">
        </label>
        <label>Date format
          <select id="date-format" name="date_format">
            {% for value, label in date_formats.items() %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
        <label id="custom-date-row" class="full" hidden>Custom date format
          <input name="custom_date_format" value="%B %d, %Y">
          <small>Python strftime syntax.</small>
        </label>
        <label class="full">Submission subtitle
          <input name="submission_subtitle" placeholder="Submitted by email">
          <small>Appears under the date in the first-page header.</small>
        </label>
        <label class="full">Addressee
          <textarea name="addressee" placeholder="Vanessa A. Countryman&#10;Secretary&#10;Securities and Exchange Commission&#10;100 F Street NE&#10;Washington, DC 20549"></textarea>
        </label>
        <label class="check full"><input type="checkbox" name="addressee_box" checked> Render addressee in a letterhead box</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Headers &amp; footer</legend>
      <div class="grid">
        <label>First-page header
          <input name="first_page_header" placeholder="Optional first-page header text">
          <small>Shown only on page 1, below the main letterhead row.</small>
        </label>
        <label>Remaining-page header
          <input name="remaining_page_header" placeholder="Optional header for pages 2+">
          <small>Shown at the top of every page after the first.</small>
        </label>
        <label>Footer page count style
          <select name="page_number_style">
            {% for value, label in page_number_styles.items() %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
          <small>Total-page formats include footnote continuation pages.</small>
        </label>
      </div>
    </fieldset>

    <div id="validation-result" class="validation" role="status" aria-live="polite"></div>

    <div class="actions">
      <button id="validate-button" class="secondary" type="button">Validate legal style</button>
      <button id="render-button" type="button">Render PDF</button>
      <small>Rendering is blocked until the source passes preflight; validation never edits the Markdown.</small>
    </div>
  </form>
</main>
<script>
  const themeToggle = document.getElementById('theme-toggle');

  function updateThemeToggle() {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeToggle.textContent = dark ? '☀️ Light' : '🌙 Dark';
    themeToggle.setAttribute('aria-pressed', String(dark));
  }

  themeToggle.addEventListener('click', () => {
    const current = document.documentElement.dataset.theme;
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('pdf-compiler-theme', next);
    updateThemeToggle();
  });
  updateThemeToggle();

  const format = document.getElementById('date-format');
  const custom = document.getElementById('custom-date-row');
  function updateCustomDate() { custom.hidden = format.value !== 'custom'; }
  format.addEventListener('change', updateCustomDate);
  updateCustomDate();

  const logo = document.getElementById('logo');
  const preview = document.getElementById('logo-preview');
  logo.addEventListener('change', () => {
    const file = logo.files && logo.files[0];
    if (!file) { preview.style.display = 'none'; return; }
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  });

  const form = document.getElementById('compiler-form');
  const validationResult = document.getElementById('validation-result');
  const validateButton = document.getElementById('validate-button');
  const renderButton = document.getElementById('render-button');

  function showValidation(result) {
    validationResult.className = 'validation';
    validationResult.replaceChildren();

    const heading = document.createElement('strong');
    if (result.error) {
      validationResult.classList.add('fail');
      heading.textContent = 'Preflight could not run';
      validationResult.append(heading, document.createTextNode(result.error));
      return false;
    }
    if (result.valid) {
      validationResult.classList.add('pass');
      heading.textContent = 'Preflight passed';
      validationResult.append(heading, document.createTextNode('No required legal-style italics are missing.'));
      return true;
    }

    validationResult.classList.add('fail');
    heading.textContent = `Preflight found ${result.issues.length} issue${result.issues.length === 1 ? '' : 's'}`;
    const list = document.createElement('ul');
    for (const issue of result.issues) {
      const item = document.createElement('li');
      const location = document.createElement('code');
      location.textContent = `line ${issue.line}, column ${issue.column}`;
      item.append(location, document.createTextNode(` — ${issue.message}`));
      list.append(item);
    }
    validationResult.append(heading, list);
    return false;
  }

  async function runValidation() {
    validateButton.disabled = true;
    renderButton.disabled = true;
    try {
      const response = await fetch('/validate', { method: 'POST', body: new FormData(form) });
      const result = await response.json();
      return showValidation(result);
    } catch (error) {
      return showValidation({ error: `Validation request failed: ${error.message}` });
    } finally {
      validateButton.disabled = false;
      renderButton.disabled = false;
    }
  }

  validateButton.addEventListener('click', runValidation);
  renderButton.addEventListener('click', async () => {
    if (await runValidation()) form.submit();
  });
</script>
</body>
</html>
